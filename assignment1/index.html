<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Test your knowledge of HTML, CSS, and JavaScript.">
  <title>Web Development Quiz</title>
  <link rel="stylesheet" href="assign.css">
  <script src="assign.js" defer></script>
</head>
<body>
  <main class="app">
    <section id="loginPage" class="card" aria-labelledby="loginTitle">
      <p class="eyebrow">HTML · CSS · JavaScript</p>
      <h1 id="loginTitle">Web Development Quiz</h1>
      <p class="intro">Ready to test your front-end knowledge? You have 60 seconds to answer 9 questions.</p>
      <form id="loginForm">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
        <label for="rollno">Roll number</label>
        <input type="text" id="rollno" name="rollno" required>
        <button class="primary-button" id="startBtn" type="submit">Start quiz</button>
      </form>
    </section>

    <section id="quizPage" class="card hidden" aria-labelledby="quizTitle">
      <div class="quiz-topline">
        <p class="eyebrow">Web Development Quiz</p>
        <p id="timer" class="timer" role="timer" aria-live="off">01:00</p>
      </div>
      <h1 id="quizTitle">Your challenge</h1>
      <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <p id="questionCount" class="question-count"></p>
      <div id="questionBox" aria-live="polite"></div>
      <button class="primary-button" id="nextBtn" type="button" disabled>Next question</button>
    </section>

    <section id="resultPage" class="card hidden" aria-labelledby="resultTitle" aria-live="polite">
      <p class="eyebrow">Quiz complete</p>
      <h1 id="resultTitle">Your result</h1>
      <p id="studentName" class="student-details"></p>
      <p id="score" class="score"></p>
      <p id="resultMessage" class="intro"></p>
      <button class="primary-button" id="playAgainBtn" type="button">Play again</button>
    </section>
  </main>
</body>
</html>
